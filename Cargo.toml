[workspace]
members = ["ft", "ft-core"]
resolver = "2"

[workspace.package]
version = "0.1.13"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
figment = { version = "0.10", features = ["toml"] }
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
chrono-english = "0.1"
ignore = "0.4"
rayon = "1.10"
tempfile = "3"
nucleo-matcher = "0.3"
regex = "1"
urlencoding = "2"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
petgraph = { version = "0.6", default-features = false, features = ["stable_graph"] }
rmp-serde = "1"
blake3 = "1"
foldhash = "0.1"
half = "2"
# Semantic search: select the tokenizer backend on `tokenizers` directly.
# `model2vec-rs`'s own backend features also enable `tokenizers/esaxx_fast`,
# which compiles C++ (used only for tokenizer training).
model2vec-rs = { version = "0.3", default-features = false, features = ["local-only"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
rust-stemmers = "1.2"
unicode-normalization = "0.1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
keyring = "4.2"
base64 = "0.23"

# Binary
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
comfy-table = "7"
owo-colors = { version = "4", features = ["supports-colors"] }
is-terminal = "0.4"
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select", "password"] }
similar = "2"
ratatui = "0.29"
crossterm = "0.28"
# Match ratatui 0.29's own width tables so wrapping/padding column math
# agrees with what the renderer actually reserves per grapheme.
unicode-width = "0.2"
unicode-segmentation = "1"

# Dev / test (shared)
assert_cmd = "2"
assert_fs = "1"
insta = { version = "1", features = ["filters"] }
predicates = "3"
proptest = "1"
